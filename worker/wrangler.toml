name = "nocap-worker"
main = "src/main.py"
compatibility_date = "2026-08-16"
compatibility_flags = ["python_workers"]

# Account ID is read from CLOUDFLARE_ACCOUNT_ID env var.
# Set it via: export CLOUDFLARE_ACCOUNT_ID=your_account_id

# ── D1 (SQLite) - 5GB free, 5M reads/day, 100k writes/day ──
[[d1_databases]]
binding = "DB"
database_name = "nocap"
database_id = "233642c4-46d1-4239-b2a4-a4f797332101"

# ── Optional storage bindings ─────────────────────────────────────
# R2/KV are intentionally not active in v0.1. Add them only when the
# corresponding bucket/namespace exists; the core product does not depend on them.

# ── Durable Objects (Tier B, v2.0 - collab) - 100k req/day, 13k GB-s/day ──
# Uncomment when you build the collab feature.
# [[durable_objects.bindings]]
# name = "COLLAB_SESSION"
# class_name = "CollabSessionDurableObject"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["CollabSessionDurableObject"]

# ── Workers AI (Tier C, optional) - 10k neurons/day free ──
# Uncomment when you build the AI mentor feature.
# [ai]
# binding = "AI"

# ── Queues (Tier B/C) - 10k ops/day free, 24h retention ──
# Use selectively: analytics aggregation, export generation, AI requests.
# Do NOT use for direct user mutations (quiz answers, architecture saves).
# Uncomment when you need them.
# [[queues.producers]]
# queue = "nocap-tasks"
# binding = "TASKS"
#
# [[queues.consumers]]
# queue = "nocap-tasks"
# max_batch_size = 10
# max_batch_timeout = 5

# ── Cron Triggers - 5 free per Worker ──
[triggers]
crons = [
  "0 0 * * *",      # midnight UTC: quota reset
  "0 1 * * *",      # 1am UTC: review scheduling reconciliation
  "0 21 * * 0",     # Sunday 9pm UTC: weekly digest
]

# ── Observability ──
[observability]
enabled = true

# ── Secrets (set via `wrangler secret put`) ──
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# FRONTEND_ORIGIN
# APP_ORIGIN
# ALLOWED_GITHUB_ID
# JWT_SECRET
