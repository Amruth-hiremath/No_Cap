name = "nocap-worker"
main = "src/main.py"
compatibility_date = "2026-08-16"
compatibility_flags = ["python_workers"]

# Account ID is read from CLOUDFLARE_ACCOUNT_ID env var.
# Set it via: export CLOUDFLARE_ACCOUNT_ID=your_account_id

# ── D1 (SQLite) - 5GB free, 5M reads/day, 100k writes/day ──
[[d1_databases]]
binding = "DB"
database_name = "nocap"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# ── R2 (Object storage) - 10GB free, free egress ──
# Used for: exported architectures, portfolio PDFs, lesson-pack downloads (Tier B)
[[r2_buckets]]
binding = "R2"
bucket_name = "nocap-assets"

# ── KV (OPTIONAL enrichment cache) - 1GB free, 100k reads/day, 1k writes/day ──
# Used ONLY for: link preview cache, AI prompt cache (Tier C). Core app works without it.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# ── Durable Objects (Tier B, v2.0 - collab) - 100k req/day, 13k GB-s/day ──
# Uncomment when you build the collab feature.
# [[durable_objects.bindings]]
# name = "COLLAB_SESSION"
# class_name = "CollabSessionDurableObject"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["CollabSessionDurableObject"]

# ── Workers AI (Tier C, optional) - 10k neurons/day free ──
# Uncomment when you build the AI mentor feature.
# [ai]
# binding = "AI"

# ── Queues (Tier B/C) - 10k ops/day free, 24h retention ──
# Use selectively: analytics aggregation, export generation, AI requests.
# Do NOT use for direct user mutations (quiz answers, architecture saves).
# Uncomment when you need them.
# [[queues.producers]]
# queue = "nocap-tasks"
# binding = "TASKS"
#
# [[queues.consumers]]
# queue = "nocap-tasks"
# max_batch_size = 10
# max_batch_timeout = 5

# ── Cron Triggers - 5 free per Worker ──
[triggers]
crons = [
  "0 0 * * *",      # midnight UTC: quota reset
  "0 1 * * *",      # 1am UTC: review scheduling reconciliation
  "0 21 * * 0",     # Sunday 9pm UTC: weekly digest
]

# ── Observability ──
[observability]
enabled = true

# ── Secrets (set via `wrangler secret put`) ──
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# ALLOWED_GITHUB_ID
# JWT_SECRET
